[workspace]
members = ["entangle-core", "android-bindings", "entangle-inference"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
thiserror = "=2.0.21"
uniffi = "=0.29.4"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
